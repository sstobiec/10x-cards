name: Pull Request

on:
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Run linter
        run: npm run lint

  unit-test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    env:
      CI: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Run unit tests with coverage
        run: npm run test:coverage

      - name: Upload unit test coverage
        uses: actions/upload-artifact@v5
        with:
          name: unit-coverage
          path: coverage/
          retention-days: 7

  e2e-test:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: lint
    environment: integration
    env:
      CI: true
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      E2E_USERNAME_ID: ${{ secrets.E2E_USERNAME_ID }}
      E2E_USERNAME: ${{ secrets.E2E_USERNAME }}
      E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js environment
        uses: ./.github/actions/setup-node-env

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload E2E test report
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-report
          path: tests/playwright-report/
          retention-days: 7

      - name: Upload E2E coverage
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: e2e-coverage
          path: test-results/
          retention-days: 7

  status-comment:
    name: Status Comment
    runs-on: ubuntu-latest
    needs: [lint, unit-test, e2e-test]
    if: success()
    env:
      CI: true

    steps:
      - name: Download unit test coverage
        uses: actions/download-artifact@v6
        with:
          name: unit-coverage
          path: coverage/

      - name: Download E2E report
        uses: actions/download-artifact@v6
        with:
          name: e2e-report
          path: e2e-report/

      - name: Create PR comment
        uses: peter-evans/create-or-update-comment@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## ✅ Pull Request Checks Passed

            All checks have completed successfully!

            | Check | Status |
            |-------|--------|
            | Lint | ✅ Passed |
            | Unit Tests | ✅ Passed |
            | E2E Tests | ✅ Passed |

            ### 📊 Artifacts
            - **Unit Test Coverage**: Available in workflow artifacts
            - **E2E Test Report**: Available in workflow artifacts

            ---
            *Automated comment by GitHub Actions*

