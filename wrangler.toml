# Cloudflare Workers configuration
# https://developers.cloudflare.com/workers/wrangler/configuration/

name = "10x-cards"
compatibility_date = "2025-09-15"
compatibility_flags = ["nodejs_compat"]

# Main entry point (generated by Astro build)
main = "./dist/_worker.js"

# Static assets directory
assets = { directory = "./dist", binding = "ASSETS" }

# KV Namespace for Astro sessions (required by @astrojs/cloudflare adapter)
[[kv_namespaces]]
binding = "SESSION"
id = "3e9eb9ff683346d3adac380f3baa53d6"

# Environment variables (secrets should be set via Cloudflare Dashboard or wrangler secret)
# [vars]
# SUPABASE_URL = ""
# SUPABASE_KEY = ""

# Build configuration
[build]
command = "npm run build"

# Observability
[observability]
enabled = true

[observability.logs]
enabled = true

